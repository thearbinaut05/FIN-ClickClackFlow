name: pkg-enum2-i71555
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  enum:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== repo packages container =="
          curl -s -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $T" "https://api.github.com/repos/${{ github.repository }}/packages?package_type=container"
          echo "== repo packages npm =="
          curl -s -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $T" "https://api.github.com/repos/${{ github.repository }}/packages?package_type=npm"
          echo "== npm registry probe =="
          curl -s -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $T" "https://npm.pkg.github.com/@thearbinaut05%2fvite_react_shadcn_ts"
          curl -s -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $T" "https://npm.pkg.github.com/@thearbinaut05%2ffin-clickclackflow"
          echo "== npm whoami =="
          curl -s -w '\nHTTP=%{http_code}\n' -H "Authorization: Bearer $T" "https://npm.pkg.github.com/-/whoami"
